name: Easy Debloat Android CI

on:
  pull_request:
    branches: [easydebloat-build]
    paths:
      - 'easydebloat-src/**'
      - '.github/workflows/easydebloat-android.yml'
  push:
    branches: [easydebloat-code-hygiene-pilot]
    paths:
      - 'easydebloat-src/**'
      - '.github/workflows/easydebloat-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JDK 17 and Android 17 preview SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          unset ANDROID_SDK_ROOT
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          rm -rf /tmp/android-cli
          mkdir -p /tmp/android-cli
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/android-cli
          rm -f /tmp/cmdline.zip
          export PATH="/tmp/android-cli/cmdline-tools/bin:$PATH"

          android --sdk="$ANDROID_HOME" sdk list --all --all-versions --canary "platforms/*" | tee /tmp/platforms.txt
          android --sdk="$ANDROID_HOME" sdk list --all --all-versions --canary "build-tools/*" | tee /tmp/build-tools.txt

          platform_pkg="$(grep -Eo 'platforms/[A-Za-z0-9._-]+' /tmp/platforms.txt | grep -Ei '(android-37|cinnamon)' | head -n1 || true)"
          build_tools_pkg="$(grep -Eo 'build-tools/[A-Za-z0-9._-]+' /tmp/build-tools.txt | grep -E '^build-tools/37' | head -n1 || true)"

          test -n "$platform_pkg" || { echo "Android 17 preview platform package not found"; exit 1; }
          test -n "$build_tools_pkg" || { echo "Android 17 build-tools package not found"; exit 1; }

          echo "Installing $platform_pkg and $build_tools_pkg"
          android --sdk="$ANDROID_HOME" sdk install --canary             platform-tools             "$platform_pkg"             "$build_tools_pkg"

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Unit tests and Android builds
        working-directory: easydebloat-src/EasyDebloat_v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          gradle testDebugUnitTest assembleDebug assembleRelease --stacktrace
