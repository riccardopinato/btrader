name: Materialize EasyDebloat source

on:
  push:
    branches: [easydebloat-code-hygiene-pilot]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Materialize packed EasyDebloat source
        shell: bash
        run: |
          set -euo pipefail
          target="easydebloat-src/EasyDebloat_v0.1.0"
          if [[ -d "$target" ]]; then
            echo "Source already materialized."
            exit 0
          fi
          mkdir -p easydebloat-src
          cat easydebloat-ci/source.part00               easydebloat-ci/source.part01               easydebloat-ci/source.part02               easydebloat-ci/source.part03               easydebloat-ci/source.part04             | base64 -d > /tmp/easydebloat.tar.gz
          tar -xzf /tmp/easydebloat.tar.gz -C easydebloat-src
          test -d "$target"
          find "$target" -type f | sort

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- easydebloat-src && git diff --cached --quiet -- easydebloat-src && [[ -z "$(git status --porcelain easydebloat-src)" ]]; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add easydebloat-src
          git commit -m "chore: materialize EasyDebloat source for audit"
          git push origin HEAD:easydebloat-code-hygiene-pilot
